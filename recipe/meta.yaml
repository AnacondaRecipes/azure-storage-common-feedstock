{% set name = "azure-storage-common" %}
{% set version = "1.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4ec87c7537d457ec95252e0e46477e2c1ccf33774ffefd05d8544682cb0ae401

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - setuptools
    - wheel
    - pip
  run:
    - python
    - azure-common >=1.1.5
    - cryptography
    - python-dateutil
    - requests

test:
  imports:
    - azure.storage.common
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/Azure/azure-storage-python
  summary: Microsoft Azure Storage Common Client Library for Python
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE.txt
  description: Microsoft Azure Storage Common Client Library for Python
  dev_url: https://github.com/Azure/azure-storage-python
  doc_url: https://github.com/Azure/azure-storage-python
  

extra:
  recipe-maintainers:
    - xhochy
